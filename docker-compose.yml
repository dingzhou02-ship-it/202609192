services:
  postgres:
    image: postgres:17-alpine
    environment:
      # 镜像的初始化账号是超级用户，不能直接给网站使用。
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?请设置独立的数据库管理员密码}
      POSTGRES_DB: ${POSTGRES_DB:-campus}
      APP_DATABASE_USER: ${POSTGRES_USER:-campus}
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置业务数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/init-postgres.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置随机密钥}
      DATABASE_URL: ${DATABASE_URL:?请设置数据库 URL，Compose 中主机名应为 postgres}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
