{# 公共原生 SVG 图标，不依赖额外图标库或前端构建工具。 #}
{% macro icon(name, class_name='ui-icon') -%}
<svg class="{{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'home' %}<path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/>
  {% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
  {% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
  {% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>
  {% elif name == 'book' %}<path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/><path d="m5 8 4 1m6 0 4-1"/>
  {% elif name == 'tools' %}<path d="m14 6 4 4 3-3a7 7 0 0 1-9 9l-5 5-4-4 5-5a7 7 0 0 1 9-9Z"/>
  {% elif name == 'file' %}<path d="M14 2H5v20h14V7Zm0 0v5h5M8 12h8M8 16h6"/>
  {% elif name == 'chat' %}<path d="M21 11a9 9 0 0 1-9 9H4l-3 2 2-7a9 9 0 1 1 18-4Z"/><path d="M7 11h.01M12 11h.01M17 11h.01"/>
  {% elif name == 'check' %}<path d="M14 2H5v20h14V7Zm0 0v5h5m-11 8 3 3 5-6"/>
  {% elif name == 'chart' %}<path d="M3 3v18h18M7 15l4-5 4 2 6-7M16 5h5v5"/>
  {% elif name == 'flask' %}<path d="M9 3h6M10 3v6L4 19a1.3 1.3 0 0 0 1 2h14a1.3 1.3 0 0 0 1-2L14 9V3M7 15h10"/>
  {% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
  {% endif %}
</svg>
{%- endmacro %}
